<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нотатки — UDC WS8</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Нотатки</h1>
      <label>
        Я увійшов як
        <select id="user">
          <option value="1">Оля</option>
          <option value="2">Тарас</option>
        </select>
      </label>
    </header>

    <form id="new-note">
      <input id="title" placeholder="Заголовок" required />
      <input id="body" placeholder="Текст" />
      <button type="submit">Додати</button>
    </form>

    <!-- Filter. Two real buttons in a labelled group; the pressed state is
         exposed with aria-pressed, so it shows up in the accessibility tree
         and is not communicated by colour alone. -->
    <div class="filters" role="group" aria-label="Фільтр нотаток">
      <button type="button" data-filter="active" aria-pressed="true">Активні</button>
      <button type="button" data-filter="archived" aria-pressed="false">Архів</button>
    </div>

    <ul id="notes" aria-label="Список нотаток"></ul>
    <p id="empty" hidden></p>

    <!-- Polite live region: archiving removes the note from the current list.
         A sighted user sees that; a screen reader user would not. -->
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
